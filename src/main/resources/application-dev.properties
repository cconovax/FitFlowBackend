
spring.application.name=fitflow

# Server
server.port=${SERVER_PORT}

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JPA
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ejecuta automáticamente data.sql en cada arranque para mantener sincronizadas
# las plantillas de email (email_templates) con el código, sin depender de correr SQL manualmente.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.default-profile-photo-url=${CLOUDINARY_DEFAULT_PROFILE_PHOTO_URL}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Mailgun
mailgun.api-key=${MAILGUN_API_KEY}
mailgun.domain=${MAILGUN_DOMAIN}
mailgun.from=${MAILGUN_FROM}
mailgun.base-url=${MAILGUN_BASE_URL:https://api.mailgun.net/v3}

# Password Reset
app.reset-password.base-url=${APP_FRONTEND_URL:http://localhost:5173}
app.reset-password.expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:60}

# Rate limiting (requests per minute per IP)
# Login: max 5 intentos/min por IP
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN}

# Register / Onboarding: max 3 intentos/min por IP
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER}

# API general: max 200 req/min por IP
app.rate-limit.api.capacity=${RATE_LIMIT_API}

# Estas dos propiedades controlan qu� informaci�n incluye Spring Boot en las respuestas de error,
# especialmente cuando ocurre una excepci�n y Spring devuelve un JSON de error
server.error.include-message=always
server.error.include-binding-errors=always

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
