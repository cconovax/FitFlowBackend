spring.application.name=fitflow

# Server
server.port=${SERVER_PORT}

server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:on_param}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Ejecuta automáticamente data.sql en cada arranque para mantener sincronizadas
# las plantillas de email (email_templates) con el código, sin depender de correr SQL manualmente.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.default-profile-photo-url=${CLOUDINARY_DEFAULT_PROFILE_PHOTO_URL}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Mailgun
mailgun.api-key=${MAILGUN_API_KEY}
mailgun.domain=${MAILGUN_DOMAIN}
mailgun.from=${MAILGUN_FROM}
mailgun.base-url=${MAILGUN_BASE_URL:https://api.mailgun.net/v3}

# Password Reset
app.reset-password.base-url=${APP_FRONTEND_URL}
app.reset-password.expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:60}

app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN}

# Register / Onboarding: max 3 intentos/min por IP
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER}

# API general: max 200 req/min por IP
app.rate-limit.api.capacity=${RATE_LIMIT_API}

# Hikari — sensible defaults for server deployments
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
